name: Build EdgeFlow GeckoView Browser

on:
  push:
    branches:
      - browser/geckoview-genesis
    paths:
      - 'browser/**'
      - '.github/workflows/geckoview-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi
          test -n "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'

      - name: Build browser APK
        run: gradle -p browser --no-daemon :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find browser/app/build/outputs/apk/debug -name '*.apk' -type f | head -n1)
          test -n "$APK"
          test -s "$APK"
          unzip -t "$APK"
          sha256sum "$APK"

      - name: Upload browser APK
        uses: actions/upload-artifact@v4
        with:
          name: EdgeFlow-Browser-Genesis-APK
          path: browser/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
