name: Build EdgeFlow GeckoView Browser

on:
  push:
    branches:
      - browser/geckoview-genesis
      - browser/v0.2-hyperion
      - browser/v0.3-atlas
      - browser/v0.4-nova
    paths:
      - 'browser/**'
      - '.github/workflows/geckoview-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate built-in performance engine
        shell: bash
        run: |
          set -euo pipefail
          node --check browser/app/src/main/assets/edgeflow/chatgpt-mobile.js
          node --check browser/app/src/main/assets/edgeflow/chatgpt.js
          node --check browser/app/src/main/assets/edgeflow/ai-generic.js
          node --check browser/app/src/main/assets/edgeflow/general.js
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('browser/app/src/main/assets/edgeflow/manifest.json')
          data = json.loads(p.read_text())
          assert data['browser_specific_settings']['gecko']['id'] == 'edgeflow-core@edgeflow.local'
          assert 'nativeMessagingFromContent' in data.get('permissions', [])
          scripts = data['content_scripts']
          assert 'https://chatgpt.com/*' in scripts[0]['matches']
          assert 'chatgpt-mobile.js' in scripts[0]['js']
          assert 'chatgpt.js' in scripts[0]['js']
          assert 'ai-generic.js' in scripts[1]['js']
          assert 'https://claude.ai/*' in scripts[1]['matches']
          assert 'https://gemini.google.com/*' in scripts[1]['matches']
          assert 'https://www.kimi.com/*' in scripts[1]['matches']
          assert 'general.js' in scripts[2]['js']
          assert 'https://chatgpt.com/*' in scripts[2]['exclude_matches']
          assert 'https://claude.ai/*' in scripts[2]['exclude_matches']
          assert 'http://*/*' in scripts[2]['matches']
          assert 'https://*/*' in scripts[2]['matches']
          print('EdgeFlow Nova extension/static checks: PASS')
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi
          test -n "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'

      - name: Build browser APK
        run: gradle -p browser --no-daemon :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find browser/app/build/outputs/apk/debug -name '*.apk' -type f | head -n1)
          test -n "$APK"
          test -s "$APK"
          unzip -t "$APK"
          sha256sum "$APK"

      - name: Upload browser APK
        uses: actions/upload-artifact@v4
        with:
          name: EdgeFlow-Browser-Nova-ARM64
          path: browser/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
