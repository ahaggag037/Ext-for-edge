name: Build EdgeFlow GeckoView Browser

on:
  push:
    branches:
      - browser/geckoview-genesis
      - browser/v0.2-hyperion
      - browser/v0.3-atlas
      - browser/v0.4-aegis
    paths:
      - 'browser/**'
      - '.github/workflows/geckoview-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: geckoview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate browser sources
        shell: bash
        run: |
          set -euo pipefail
          node --check browser/app/src/main/assets/edgeflow/chatgpt.js
          if [ -f browser/app/src/main/assets/edgeflow/global_optimizer.js ]; then
            node --check browser/app/src/main/assets/edgeflow/global_optimizer.js
          fi
          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path('browser/app/src/main/assets/edgeflow/manifest.json').read_text())
          assert manifest['browser_specific_settings']['gecko']['id'] == 'edgeflow-core@edgeflow.local'
          assert 'nativeMessagingFromContent' in manifest.get('permissions', [])
          matches = [m for script in manifest.get('content_scripts', []) for m in script.get('matches', [])]
          assert 'https://chatgpt.com/*' in matches

          android_manifest = Path('browser/app/src/main/AndroidManifest.xml').read_text()
          gradle = Path('browser/app/build.gradle').read_text()
          if 'browser/v0.4-aegis' in '${{ github.ref }}':
              assert '.AegisActivity' in android_manifest
              assert "versionName '0.4.0-aegis'" in gradle
              chatgpt_js = Path('browser/app/src/main/assets/edgeflow/chatgpt.js').read_text()
              global_js = Path('browser/app/src/main/assets/edgeflow/global_optimizer.js').read_text()
              assert "host === 'chatgpt.com'" in global_js
              # The performance engine must never rewrite ChatGPT transport/history payloads.
              forbidden = ['current_node', 'json.mapping', 'window.fetch =', 'XMLHttpRequest.prototype', 'WebSocket.prototype']
              for needle in forbidden:
                  assert needle not in chatgpt_js, f'forbidden ChatGPT hook: {needle}'
              required = [
                  'BrowserDataStore.java', 'SiteDataController.java', 'WebNotificationController.java',
                  'PerformanceGuardian.java', 'AegisActivity.java'
              ]
              root = Path('browser/app/src/main/java/com/edgeflow/browser')
              for name in required:
                  assert (root / name).exists(), name
          print('EdgeFlow browser static checks: PASS')
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi
          test -n "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'

      - name: Build browser APK
        run: gradle -p browser --no-daemon :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find browser/app/build/outputs/apk/debug -name '*.apk' -type f | head -n1)
          test -n "$APK"
          test -s "$APK"
          SIZE=$(stat -c%s "$APK")
          # Guard against accidentally shipping a 500MB universal APK to a limited-data phone.
          test "$SIZE" -lt 230000000
          unzip -t "$APK"
          unzip -l "$APK" | grep -q 'assets/edgeflow/manifest.json'
          unzip -l "$APK" | grep -q 'assets/edgeflow/chatgpt.js'
          if [ -f browser/app/src/main/assets/edgeflow/global_optimizer.js ]; then
            unzip -l "$APK" | grep -q 'assets/edgeflow/global_optimizer.js'
          fi
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/'
          if unzip -l "$APK" | grep -qE 'lib/(x86|x86_64|armeabi-v7a)/'; then
            echo 'Unexpected non-ARM64 native libraries in mobile APK' >&2
            exit 1
          fi
          sha256sum "$APK"

      - name: Upload browser APK
        uses: actions/upload-artifact@v4
        with:
          name: EdgeFlow-Browser-${{ github.ref_name == 'browser/v0.4-aegis' && 'Aegis-DEV-ARM64' || github.ref_name }}
          path: browser/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
