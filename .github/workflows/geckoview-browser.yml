name: Build EdgeFlow GeckoView Browser

on:
  push:
    branches:
      - browser/geckoview-genesis
      - browser/v0.2-hyperion
      - browser/v0.3-atlas
      - browser/v0.4-nova
    paths:
      - 'browser/**'
      - '.github/workflows/geckoview-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      EDGEFLOW_KEYSTORE_B64: ${{ secrets.EDGEFLOW_KEYSTORE_B64 }}
      EDGEFLOW_STORE_PASSWORD: ${{ secrets.EDGEFLOW_STORE_PASSWORD }}
      EDGEFLOW_KEY_ALIAS: ${{ secrets.EDGEFLOW_KEY_ALIAS }}
      EDGEFLOW_KEY_PASSWORD: ${{ secrets.EDGEFLOW_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate built-in performance engine
        shell: bash
        run: |
          set -euo pipefail
          node --check browser/app/src/main/assets/edgeflow/page-meta.js
          node --check browser/app/src/main/assets/edgeflow/chatgpt-mobile.js
          node --check browser/app/src/main/assets/edgeflow/chatgpt.js
          node --check browser/app/src/main/assets/edgeflow/ai-generic.js
          node --check browser/app/src/main/assets/edgeflow/general.js
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('browser/app/src/main/assets/edgeflow/manifest.json')
          data = json.loads(p.read_text())
          assert data['browser_specific_settings']['gecko']['id'] == 'edgeflow-core@edgeflow.local'
          assert data['version'].startswith('0.4.')
          assert 'nativeMessagingFromContent' in data.get('permissions', [])
          scripts = data['content_scripts']
          assert 'https://chatgpt.com/*' in scripts[0]['matches']
          assert 'page-meta.js' in scripts[0]['js']
          assert 'chatgpt-mobile.js' in scripts[0]['js']
          assert 'chatgpt.js' in scripts[0]['js']
          assert 'page-meta.js' in scripts[1]['js']
          assert 'ai-generic.js' in scripts[1]['js']
          assert 'https://claude.ai/*' in scripts[1]['matches']
          assert 'https://gemini.google.com/*' in scripts[1]['matches']
          assert 'https://www.kimi.com/*' in scripts[1]['matches']
          assert 'page-meta.js' in scripts[2]['js']
          assert 'general.js' in scripts[2]['js']
          assert 'https://chatgpt.com/*' in scripts[2]['exclude_matches']
          assert 'https://claude.ai/*' in scripts[2]['exclude_matches']
          assert 'http://*/*' in scripts[2]['matches']
          assert 'https://*/*' in scripts[2]['matches']
          print('EdgeFlow Nova extension/static checks: PASS')
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi
          test -n "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Prepare optional release signing
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${EDGEFLOW_KEYSTORE_B64:-}" ] \
             && [ -n "${EDGEFLOW_STORE_PASSWORD:-}" ] \
             && [ -n "${EDGEFLOW_KEY_ALIAS:-}" ] \
             && [ -n "${EDGEFLOW_KEY_PASSWORD:-}" ]; then
            printf '%s' "$EDGEFLOW_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/edgeflow-release.jks"
            echo "EDGEFLOW_KEYSTORE_PATH=$RUNNER_TEMP/edgeflow-release.jks" >> "$GITHUB_ENV"
            echo "EDGEFLOW_SIGNED_RELEASE=1" >> "$GITHUB_ENV"
            echo "Stable signing secrets detected; CI will build a release APK."
          else
            echo "EDGEFLOW_SIGNED_RELEASE=0" >> "$GITHUB_ENV"
            echo "Release signing secrets are not configured; CI will build a development APK."
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'

      - name: Android lint
        run: gradle -p browser --no-daemon :app:lintDebug

      - name: Build browser APK
        shell: bash
        run: |
          set -euo pipefail
          if [ "${EDGEFLOW_SIGNED_RELEASE:-0}" = "1" ]; then
            gradle -p browser --no-daemon :app:assembleRelease
          else
            gradle -p browser --no-daemon :app:assembleDebug
          fi

      - name: Verify APK deeply
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find browser/app/build/outputs/apk -name '*.apk' -type f | head -n1)
          test -n "$APK"
          test -s "$APK"
          unzip -t "$APK"
          unzip -l "$APK" > /tmp/apk-list.txt
          grep -q 'assets/edgeflow/manifest.json' /tmp/apk-list.txt
          grep -q 'assets/edgeflow/page-meta.js' /tmp/apk-list.txt
          grep -q 'assets/edgeflow/chatgpt.js' /tmp/apk-list.txt
          grep -q 'assets/edgeflow/chatgpt-mobile.js' /tmp/apk-list.txt
          grep -q 'assets/edgeflow/ai-generic.js' /tmp/apk-list.txt
          grep -q 'assets/edgeflow/general.js' /tmp/apk-list.txt
          grep -q 'lib/arm64-v8a/' /tmp/apk-list.txt
          if grep -Eq 'lib/(x86|x86_64|armeabi-v7a)/' /tmp/apk-list.txt; then
            echo 'Unexpected non-ARM64 native ABI in mobile build' >&2
            exit 1
          fi
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          sha256sum "$APK"
          echo "EDGEFLOW_APK=$APK" >> "$GITHUB_ENV"

      - name: Upload browser APK
        uses: actions/upload-artifact@v4
        with:
          name: EdgeFlow-Browser-Nova-ARM64
          path: ${{ env.EDGEFLOW_APK }}
          if-no-files-found: error
          retention-days: 30
