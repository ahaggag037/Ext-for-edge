name: Build EdgeFlow Installer APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct source payload
        shell: bash
        run: |
          cat payload/part-*.b64 | base64 -d > /tmp/edgeflow-project.tar.gz
          echo "215604a0ac62faf4c5a5b5dfe1b598aff24373b13eef7e6e2d347313f1345ee1  /tmp/edgeflow-project.tar.gz" | sha256sum -c -
          tar -xzf /tmp/edgeflow-project.tar.gz

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify embedded EdgeFlow CRX
        shell: bash
        run: |
          cat app/src/main/assets/crx-parts/part-*.b64 | base64 -d > /tmp/edgeflow.crx
          echo "d1a20e525e51f5bfaf632956618a588f312d6c420ddce7279ed4b057ae370444  /tmp/edgeflow.crx" | sha256sum -c -
          test "$(head -c 4 /tmp/edgeflow.crx)" = "Cr24"

      - name: Build installable debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: APK checksum
        run: sha256sum app/build/outputs/apk/debug/*.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: EdgeFlow-Installer-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
