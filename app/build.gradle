plugins {
    id 'com.android.application'
}

android {
    namespace 'com.edgeflow.installer'
    compileSdk 35

    defaultConfig {
        applicationId 'com.edgeflow.installer'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0.0'

        testInstrumentationRunner 'android.test.InstrumentationTestRunner'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
    }

    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
        }
    }
}
