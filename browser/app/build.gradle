plugins {
    id 'com.android.application'
}

android {
    namespace 'com.edgeflow.browser'
    compileSdk 36

    defaultConfig {
        applicationId 'com.edgeflow.browser'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.2.0-hyperion'
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
    }

    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
        }
    }
}

dependencies {
    implementation 'org.mozilla.geckoview:geckoview:153.0.20260810162159'
}
