plugins {
    id 'com.android.application'
}

android {
    namespace 'com.edgeflow.browser'
    compileSdk 36

    defaultConfig {
        applicationId 'com.edgeflow.browser'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '0.4.0-aegis'
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
    }

    packaging {
        jniLibs {
            // The target phone has a limited data budget. Compress Gecko's native
            // libraries in the APK and let Android extract them at install time.
            // This trades installed-storage/startup packaging efficiency for a much
            // smaller over-the-network APK while keeping the same ARM64 runtime bits.
            useLegacyPackaging true
        }
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
        }
    }
}

dependencies {
    implementation 'org.mozilla.geckoview:geckoview:153.0.20260810162159'
}
